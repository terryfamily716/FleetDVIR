<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetDVIR - Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1419; color: #e7e9ea; min-height: 100vh; display: flex; flex-direction: column; }
  .header { background: #1a1f2e; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2d3748; }
  .header h1 { font-size: 20px; color: #3b82f6; }
  .header .driver-info { font-size: 14px; color: #9ca3af; text-align: right; }
  .header .dash-link { color: #60a5fa; font-size: 14px; font-weight: 600; text-decoration: none; margin-right: 16px; }
  .header .dash-link:hover { color: #93c5fd; }
  .top-buttons { display: flex; gap: 12px; padding: 16px 20px; }
  .btn { flex: 1; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; position: relative; }
  .btn-dvir { background: #1e3a5f; color: #60a5fa; }
  .btn-chat { background: #2563eb; color: white; }
  .badge { position: absolute; top: 8px; right: 8px; background: #ef4444; color: white; font-size: 12px; font-weight: 700; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .chat-layout { display: flex; flex: 1; min-height: 0; }
  .conv-list { width: 40%; border-right: 1px solid #2d3748; overflow-y: auto; }
  .online-section { padding: 12px 16px 4px; }
  .online-section h3 { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .online-person { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
  .online-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; flex-shrink: 0; box-shadow: 0 0 6px #22c55e; }
  .online-person .ago { font-size: 11px; color: #6b7280; margin-left: auto; }
  .directory-btn { margin: 12px 16px; background: #1a1f2e; border: 1px solid #3b82f6; color: #60a5fa; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
  .directory-btn:hover { background: #1e3a5f; }
  .conv-item { padding: 14px 16px; border-bottom: 1px solid #1f2937; cursor: pointer; }
  .conv-item:hover { background: #1a1f2e; }
  .conv-item.active { background: #1e3a5f; }
  .conv-item .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .conv-item .name .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; flex-shrink: 0; box-shadow: 0 0 5px #22c55e; }
  .conv-item .name .dot.offline { background: #4b5563; box-shadow: none; }
  .conv-item .preview { font-size: 13px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-item .time { font-size: 11px; color: #6b7280; float: right; }
  .conv-item .unread { background: #ef4444; color: white; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 7px; margin-left: 6px; }
  .thread { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .thread-header { padding: 14px 16px; background: #1a1f2e; border-bottom: 1px solid #2d3748; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .thread-header .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .thread-header .status { font-size: 12px; color: #22c55e; font-weight: 400; margin-left: auto; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; }
  .msg.them { background: #1e3a5f; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.me { background: #166534; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg .sender { font-size: 11px; color: #9ca3af; margin-bottom: 4px; }
  .msg .time { font-size: 10px; color: #6b7280; margin-top: 4px; text-align: right; }
  .input-bar { display: flex; gap: 10px; padding: 12px 16px; background: #1a1f2e; border-top: 1px solid #2d3748; }
  .input-bar input { flex: 1; background: #0f1419; border: 1px solid #2d3748; border-radius: 24px; padding: 12px 18px; color: #e7e9ea; font-size: 14px; outline: none; }
  .input-bar input:focus { border-color: #3b82f6; }
  .input-bar button { background: #3b82f6; color: white; border: none; border-radius: 24px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .bottom-btns { display: flex; gap: 10px; margin: 12px 16px; }
  .new-group-btn, .new-dm-btn { flex: 1; background: #1a1f2e; border: 1px dashed #3b82f6; color: #60a5fa; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
  .new-group-btn:hover, .new-dm-btn:hover { background: #1e3a5f; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6b7280; font-size: 14px; gap: 8px; }
  .error-banner { background: #7f1d1d; color: #fca5a5; padding: 10px 16px; font-size: 13px; display: none; }
  @media (max-width: 600px) {
    .conv-list { width: 100%; display: none; }
    .conv-list.mobile-show { display: block; }
    .thread.mobile-hide { display: none; }
  }
</style>
</head>
<body>
  <div class="header">
    <div style="display:flex;align-items:center">
      <a class="dash-link" href="dashboard.html">&#8592; Dashboard</a>
      <h1>FleetDVIR</h1>
    </div>
    <div class="driver-info" id="driverInfo">Loading...</div>
  </div>
  <div class="top-buttons">
    <button class="btn btn-dvir" onclick="location.href='dashboard.html'">Create DVIR</button>
    <button class="btn btn-chat">Chat<span class="badge" id="chatBadge">0</span></button>
  </div>
  <div class="error-banner" id="errorBanner"></div>
  <div class="chat-layout">
    <div class="conv-list" id="convList">
      <div class="online-section">
        <h3>Online Now</h3>
        <div id="onlineList"><div class="online-person" style="color:#6b7280">Loading...</div></div>
      </div>
      <button class="directory-btn" onclick="location.href='directory.html'">Directory</button>
      <div id="convItems"></div>
      <div class="bottom-btns">
        <button class="new-group-btn" onclick="alert('Group creation coming soon')">+ New Group</button>
        <button class="new-dm-btn" onclick="location.href='directory.html'">+ New DM</button>
      </div>
    </div>
    <div class="thread" id="thread">
      <div class="thread-header" id="threadHeader">Select a conversation</div>
      <div class="messages" id="messages"></div>
      <div class="input-bar">
        <input type="text" id="msgInput" placeholder="Type a message..." disabled>
        <button id="sendBtn" disabled>Send</button>
      </div>
    </div>
  </div>
<script>
const APPWRITE_ENDPOINT = "https://sfo.cloud.appwrite.io/v1";
const PROJECT_ID = "6b02c0310015eb4d8908";
const API_KEY = "standard_736848978be3c81a7a41e08a711185f92c7e894c58e0b2Oe8dd5cb85cf7e6e225d3fadd3097fa0b9b1061dc9be8c3f6bbbb83373d2d374875b0862709d24e45734523485b26be816e9b71650ca9fe47d5bc0bf284fa732e84ff265bf4154f87796ba57e29dc1a1821fe24602c0b2871d6dc0833b4ee4105e83871a425020e62b";
const DATABASE_ID = "main";
const CHAT_TABLE = "chat-messages";
const PROFILES_TABLE = "profiles";

const headers = {
  "Content-Type": "application/json",
  "X-Appwrite-Project": PROJECT_ID,
  "X-Appwrite-Key": API_KEY
};

let currentUser = null;
let activeConv = null;
let pollTimer = null;

function showError(msg) {
  const b = document.getElementById("errorBanner");
  b.textContent = msg;
  b.style.display = "block";
}

function hideError() {
  document.getElementById("errorBanner").style.display = "none";
}

async function appwriteFetch(path, opts) {
  const res = await fetch(APPWRITE_ENDPOINT + path, Object.assign({ headers: headers }, opts || {}));
  if (!res.ok) {
    const t = await res.text();
    throw new Error(res.status + " " + t);
  }
  return res.json();
}

async function loadProfiles() {
  const data = await appwriteFetch("/databases/" + DATABASE_ID + "/tables/" + PROFILES_TABLE + "/rows?limit=100");
  return data.rows || [];
}

async function loadMessages(senderId, recipientId, groupId) {
  let q = "";
  if (groupId) {
    q = "queries[]=" + encodeURIComponent(JSON.stringify(["equal(\"group-id\",[" + JSON.stringify(groupId) + "])"]));
  } else {
    q = "queries[]=" + encodeURIComponent(JSON.stringify(["equal(\"sender-id\",[" + JSON.stringify(senderId) + "])"])) +
        "&queries[]=" + encodeURIComponent(JSON.stringify(["equal(\"recipient-id\",[" + JSON.stringify(recipientId) + "])"]));
  }
  const data = await appwriteFetch("/databases/" + DATABASE_ID + "/tables/" + CHAT_TABLE + "/rows?" + q + "&limit=100");
  return data.rows || [];
}

async function sendMessage(text) {
  if (!activeConv || !currentUser) return;
  const body = {
    "sender-id": currentUser["$id"],
    "message": text,
    "created-at": new Date().toISOString()
  };
  if (activeConv.groupId) {
    body["group-id"] = activeConv.groupId;
  } else {
    body["recipient-id"] = activeConv.recipientId;
  }
  await appwriteFetch("/databases/" + DATABASE_ID + "/tables/" + CHAT_TABLE + "/rows", {
    method: "POST",
    body: JSON.stringify(body)
  });
}

function renderMessages(rows) {
  const box = document.getElementById("messages");
  box.innerHTML = "";
  rows.sort(function(a, b) { return new Date(a["created-at"]) - new Date(b["created-at"]); });
  rows.forEach(function(r) {
    const mine = currentUser && r["sender-id"] === currentUser["$id"];
    const div = document.createElement("div");
    div.className = "msg " + (mine ? "me" : "them");
    const senderName = mine ? "You" : (r["sender-id"] || "Unknown");
    div.innerHTML = "<div class=\"sender\">" + senderName + "</div>" +
      r["message"] +
      "<div class=\"time\">" + new Date(r["created-at"]).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) + "</div>";
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function renderConvs(profiles) {
  const box = document.getElementById("convItems");
  box.innerHTML = "";
  profiles.forEach(function(p) {
    if (currentUser && p["$id"] === currentUser["$id"]) return;
    const div = document.createElement("div");
    div.className = "conv-item";
    div.innerHTML = "<span class=\"time\">" + (p["badge-status"] === "approved" ? "approved" : "pending") + "</span>" +
      "<div class=\"name\"><span class=\"dot " + (p["badge-status"] === "approved" ? "" : "offline") + ""></span>" + p["first-name"] + " " + p["last-name"] + "</div>" +
      "<div class=\"preview\">" + p["company"] + "</div>";
    div.onclick = function() {
      document.querySelectorAll(".conv-item").forEach(function(el) { el.classList.remove("active"); });
      div.classList.add("active");
      activeConv = { recipientId: p["$id"], name: p["first-name"] + " " + p["last-name"] };
      document.getElementById("threadHeader").innerHTML = "<span class=\"dot\"></span>" + activeConv.name;
      document.getElementById("msgInput").disabled = false;
      document.getElementById("sendBtn").disabled = false;
      refreshThread();
    };
    box.appendChild(div);
  });
}

async function refreshThread() {
  if (!activeConv || !currentUser) return;
  try {
    const rows = await loadMessages(currentUser["$id"], activeConv.recipientId, null);
    renderMessages(rows);
  } catch (e) {
    showError("Failed to load messages: " + e.message);
  }
}

async function init() {
  try {
    hideError();
    const profiles = await loadProfiles();
    if (profiles.length === 0) {
      document.getElementById("driverInfo").textContent = "No profiles found";
      document.getElementById("convItems").innerHTML = "<div class=\"empty-state\">No drivers yet. Create a profile first.</div>";
      return;
    }
    currentUser = profiles[0];
    document.getElementById("driverInfo").innerHTML = currentUser["first-name"] + " " + currentUser["last-name"] + "<br>Badge: " + (currentUser["badge-status"] || "pending");
    renderConvs(profiles);
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(refreshThread, 5000);
  } catch (e) {
    showError("Failed to load profiles: " + e.message);
    document.getElementById("driverInfo").textContent = "Error loading";
  }
}

document.getElementById("sendBtn").onclick = async function() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  try {
    await sendMessage(text);
    refreshThread();
  } catch (e) {
    showError("Send failed: " + e.message);
  }
};

document.getElementById("msgInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") document.getElementById("sendBtn").click();
});

init();
</script>
</body>
</html>
