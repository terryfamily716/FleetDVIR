<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetDVIR - Post-Trip</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #111; color: #fff; margin: 0; padding: 20px; }
  .card { background: #222; border-radius: 12px; padding: 24px; max-width: 420px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 20px; }
  label { display: block; color: #999; font-size: 13px; margin-bottom: 4px; }
  input[type="text"], input[type="number"] { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #333; color: #fff; font-size: 16px; margin-bottom: 16px; box-sizing: border-box; }
  .section-title { font-size: 16px; font-weight: 600; margin: 20px 0 10px; color: #fff; }
  .checklist { color: #ccc; font-size: 14px; line-height: 2; padding-left: 18px; }
  .status-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .status-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .green { background: #2ecc71; color: #fff; }
  .red { background: #e74c3c; color: #fff; }
  .sig-line { border-bottom: 1px solid #555; height: 40px; margin-bottom: 16px; }
  .sig-label { color: #999; font-size: 12px; margin-bottom: 4px; }
  .back { color: #007aff; font-size: 14px; margin-bottom: 16px; display: block; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <a class="back" href="mockup.html">&larr; Back to Dashboard</a>
    <h1>Post-Trip DVIR</h1>
    <label>Tractor Number</label>
    <input type="text" value="T-1042">
    <label>Trailer Number</label>
    <input type="text" value="TR-88">
    <label>Odometer / Mileage</label>
    <input type="number" value="184732">
    <div class="section-title">DOT Defect Checklist</div>
    <ul class="checklist">
      <li>Brakes</li>
      <li>Steering</li>
      <li>Tires</li>
      <li>Lights</li>
      <li>Coupling devices</li>
      <li>Wheels and rims</li>
      <li>Emergency equipment</li>
    </ul>
    <div class="section-title">Status</div>
    <div class="status-row">
      <button class="status-btn green">No Defects Found</button>
      <button class="status-btn red">Defects Found</button>
    </div>
    <div class="section-title">Body Damage Photos</div>
    <button class="btn" style="background:#333;display:block;width:100%;padding:14px;border:none;border-radius:8px;color:#fff;font-size:16px;font-weight:600;margin-bottom:16px;cursor:pointer;">Take Photo</button>
    <div class="section-title">Driver Signature</div>
    <div class="sig-label">Sign below</div>
    <div class="sig-line"></div>
    <button style="display:block;width:100%;padding:14px;border:none;border-radius:8px;background:#007aff;color:#fff;font-size:16px;font-weight:600;cursor:pointer;">Submit DVIR</button>
  </div>
</body>
</html>
