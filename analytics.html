<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetDVIR - Admin Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1419; color: #e7e9ea; min-height: 100vh; }
  .header { background: #1a1f2e; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2d3748; }
  .header h1 { font-size: 20px; color: #3b82f6; }
  .header .admin-info { font-size: 14px; color: #9ca3af; }
  .back { color: #60a5fa; text-decoration: none; font-size: 14px; }
  .section { padding: 20px; }
  .section h2 { font-size: 15px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
  .section h3 { font-size: 16px; color: #e7e9ea; margin: 24px 0 12px; }
  .summary-cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { background: #1a1f2e; border-radius: 10px; padding: 16px 20px; flex: 1; min-width: 140px; text-align: center; border: 1px solid #2d3748; }
  .card h3 { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .card p { font-size: 28px; font-weight: 700; color: #3b82f6; }
  table { width: 100%; border-collapse: collapse; background: #1a1f2e; border-radius: 12px; overflow: hidden; border: 1px solid #2d3748; }
  th { background: #0f1419; color: #9ca3af; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; padding: 12px 14px; text-align: left; border-bottom: 1px solid #2d3748; }
  td { padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #2d3748; }
  tr:last-child td { border-bottom: none; }
  .trend-list { list-style: none; background: #1a1f2e; border-radius: 12px; border: 1px solid #2d3748; overflow: hidden; }
  .trend-list li { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #2d3748; }
  .trend-list li:last-child { border-bottom: none; }
  .error { color: #fca5a5; padding: 20px; }
  .loading { color: #9ca3af; padding: 40px 20px; text-align: center; }
  tr.equip-open td { background: #3a1a1a; }
  @media (max-width: 768px) {
    .summary-cards { flex-direction: column; }
    table { font-size: 12px; }
    th, td { padding: 8px 10px; }
  }
</style>
</head>
<body>
  <div class="header">
    <a class="back" href="dashboard.html">&larr; Dashboard</a>
    <h1>Admin Analytics</h1>
    <div class="admin-info">Admin</div>
  </div>
  <div class="section" id="content">
    <p class="loading">Loading analytics...</p>
  </div>
<script>
// ============================================================
// SUPABASE CONFIG - replace with your project URL and anon key
// ============================================================
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadAnalytics() {
  const content = document.getElementById('content);
  try {
    const [profilesRes, dvirsRes, defectsRes, messagesRes] = await Promise.all([
      sb.from('profiles').select('*'),
      sb.from('dvirs').select('*').order('created_at', { ascending: false }),
      sb.from('defects').select('*'),
      sb.from('chat_messages').select('*')
    ]);

    if (profilesRes.error) throw profilesRes.error;
    if (dvirsRes.error) throw dvirsRes.error;
    if (defectsRes.error) throw defectsRes.error;
    if (messagesRes.error) throw messagesRes.error;

    const drivers = profilesRes.data || [];
    const dvirs = dvirsRes.data || [];
    const defects = defectsRes.data || [];
    const messages = messagesRes.data || [];

    const totalDrivers = drivers.length;

    const now = new Date();
    const activeToday = drivers.filter((d) => {
      if (!d.updated_at) return false;
      const last = new Date(d.updated_at);
      return last.toDateString() === now.toDateString();
    }).length;

    const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
    const dvirsThisWeek = dvirs.filter((d) => {
      const created = new Date(d.created_at);
      return created >= weekAgo;
    }).length;

    const openDefects = defects.filter((d) => !d.resolved).length;

    // Per-driver table
    const driverRows = drivers.map((d) => {
      const myDvirs = dvirs.filter((dv) => dv.driver_id === d.id);
      const myDefects = defects.filter((df) => myDvirs.some((dv) => dv.id === df.dvir_id));
      const resolved = myDefects.filter((df) => df.resolved).length;
      const messagesSent = messages.filter((m) => m.sender_id === d.id).length;
      return {
        name: d.first_name + ' ' + d.last_name,
        role: d.role,
        updatedAt: d.updated_at ? new Date(d.updated_at).toLocaleString() : 'Never',
        dvirs: myDvirs.length,
        defectsFound: myDefects.length,
        defectsResolved: resolved,
        messagesSent
      };
    });

    // Defect trends by type (item field)
    const trendMap = {};
    defects.forEach((df) => {
      trendMap[df.item] = (trendMap[df.item] || 0) + 1;
    });
    const trends = Object.entries(trendMap)
      .sort((a, b) => b[1] - a[1])
      .map(([type, count]) => ({ type, count }));

    // Equipment health (tractor_number / trailer_number)
    const equipMap = {};
    defects.forEach((df) => {
      const key = (df.tractor_number || '') + ' / ' + (df.trailer_number || '');
      if (!equipMap[key]) equipMap[key] = { open: 0, resolved: 0 };
      if (df.resolved) equipMap[key].resolved += 1;
      else equipMap[key].open += 1;
    });
    const equipment = Object.entries(equipMap)
      .map(([unit, counts]) => ({ unit, ...counts }))
      .sort((a, b) => b.open - a.open);

    let html = '';
    html += '<div class="summary-cards">';
    html += '<div class="card"><h3>Total Drivers</h3><p>' + totalDrivers + '</p></div>';
    html += '<div class="card"><h3>Active Today</h3><p>' + activeToday + '</p></div>';
    html += '<div class="card"><h3>DVIRs This Week</h3><p>' + dvirsThisWeek + '</p></div>';
    html += '<div class="card"><h3>Open Defects</h3><p>' + openDefects + '</p></div>';
    html += '</div>';

    html += '<h3>Per-Driver Activity</h3>';
    html += '<table><thead><tr><th>Name</th><th>Role</th><th>Last Active</th><th>DVIRs</th><th>Defects Found</th><th>Defects Resolved</th><th>Messages Sent</th></tr></thead><tbody>';
    driverRows.forEach((row) => {
      html += '<tr' + (row.role === 'admin' ? ' style="font-weight:bold"' : '') + '>';
      html += '<td>' + row.name + '</td><td>' + row.role + '</td><td>' + row.updatedAt + '</td><td>' + row.dvirs + '</td><td>' + row.defectsFound + '</td><td>' + row.defectsResolved + '</td><td>' + row.messagesSent + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';

    html += '<h3>Defect Trends by Type</h3>';
    html += '<ul class="trend-list">';
    if (trends.length === 0) {
      html += '<li>No defects logged yet.</li>';
    } else {
      trends.forEach((t) => {
        html += '<li>' + t.type + ': ' + t.count + '</li>';
      });
    }
    html += '</ul>';

    html += '<h3>Equipment Health</h3>';
    html += '<table><thead><tr><th>Tractor / Trailer</th><th>Open Defects</th><th>Resolved</th></tr></thead><tbody>';
    if (equipment.length === 0) {
      html += '<tr><td colspan="3">No equipment defects yet.</td></tr>';
    } else {
      equipment.forEach((eq) => {
        html += '<tr' + (eq.open > 0 ? ' class="equip-open"' : '') + '>';
        html += '<td>' + eq.unit + '</td><td>' + eq.open + '</td><td>' + eq.resolved + '</td>';
        html += '</tr>';
      });
    }
    html += '</tbody></table>';

    content.innerHTML = html;
  } catch (err) {
    content.innerHTML = '<p class="error">Error loading analytics: ' + err.message + '</p>';
  }
}

loadAnalytics();
</script>
</body>
</html>
