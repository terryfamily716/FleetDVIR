<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetDVIR Mockup</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #111; color: #fff; margin: 0; padding: 20px; }
  .card { background: #222; border-radius: 12px; padding: 24px; max-width: 420px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 12px; }
  .tag { color: #999; font-size: 15px; margin-bottom: 24px; }
  .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; background: #007aff; color: #fff; font-size: 16px; font-weight: 600; margin-bottom: 12px; cursor: pointer; }
  ul { color: #ccc; font-size: 14px; line-height: 1.8; padding-left: 18px; }
  .footer { color: #666; font-size: 12px; text-align: center; margin-top: 24px; }
  .badge { background: #e74c3c; color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 12px; margin-left: 6px; }
  .admin-btn { background: #333; }
</style>
</head>
<body>
  <div class="card">
    <h1>FleetDVIR</h1>
    <p class="tag">Digital inspection reports for trucking fleets</p>
    <ul>
      <li>DOT-compliant defect checklists</li>
      <li>Photo documentation for defects and body damage</li>
      <li>Real-time supervisor visibility</li>
      <li>Built-in driver chat</li>
    </ul>
    <button class="btn">Sign In</button>
    <button class="btn admin-btn">Admin Analytics</button>
    <p class="footer">Ralph's Grocery</p>
  </div>
  <div class="card" style="margin-top: 20px;">
    <h1 style="font-size: 20px;">Driver Dashboard</h1>
    <button class="btn">Create DVIR <span class="badge">2</span></button>
    <button class="btn">Chat <span class="badge">1</span></button>
  </div>
</body>
</html>
